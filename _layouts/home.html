<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}{% if page.title and page.title != "" %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author.name }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:image" content="{{ '/' | append: site.author.avatar | relative_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
</head>
<body>

  {% assign a = site.author %}

  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- ===================== NAV ===================== -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#top">{{ a.name }}</a>
      <ul class="nav__links">
        <li class="nav__link"><a href="#about">About</a></li>
        <li class="nav__link"><a href="#news">News</a></li>
        <li class="nav__link"><a href="#publications">Papers</a></li>
        <li class="nav__link"><a href="#honors">Awards</a></li>
        <li class="nav__sep" aria-hidden="true"></li>
        <li><a class="nav__icon" href="{{ a.googlescholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="fa-solid fa-graduation-cap"></i></a></li>
      </ul>
    </div>
  </nav>

  <!-- ===================== HERO ===================== -->
  <header class="hero wrap" id="top">
    <img class="hero__avatar reveal" src="{{ '/' | append: a.avatar | relative_url }}" alt="{{ a.name }}">
    <h1 class="hero__name reveal">{{ a.name }}</h1>
    <p class="hero__role reveal">
      Research Scientist<span class="sep">·</span><span class="place">{{ a.bio }}, {{ a.location }}</span>
    </p>
    <p class="hero__tagline reveal">{{ site.description }}</p>
    <div class="hero__meta reveal">
      <span class="hero__social">
        <a href="{{ a.googlescholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="fa-solid fa-graduation-cap"></i></a>
        <a href="https://github.com/{{ a.github }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:{{ a.email }}" aria-label="Email"><i class="fa-regular fa-envelope"></i></a>
      </span>
    </div>
  </header>

  <!-- ===================== BODY ===================== -->
  <main class="wrap">
    {{ content }}
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer wrap">
    <span>© {{ site.time | date: "%Y" }} {{ a.name }}</span>
    <span>{{ a.location }} · <a href="mailto:{{ a.email }}">{{ a.email }}</a></span>
  </footer>

  <!-- ===================== SCRIPTS ===================== -->
  <script>
    // Nav: shadow on scroll + active-section highlight
    (function () {
      var nav = document.getElementById('nav');
      var onScroll = function () {
        nav.classList.toggle('is-scrolled', window.scrollY > 8);
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      var links = Array.prototype.slice.call(document.querySelectorAll('.nav__links a[href^="#"]'));
      var map = {};
      links.forEach(function (l) {
        var id = l.getAttribute('href').slice(1);
        var sec = document.getElementById(id);
        if (sec) map[id] = l;
      });
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            links.forEach(function (l) { l.classList.remove('is-active'); });
            if (map[e.target.id]) map[e.target.id].classList.add('is-active');
          }
        });
      }, { rootMargin: '-45% 0px -50% 0px' });
      Object.keys(map).forEach(function (id) { spy.observe(document.getElementById(id)); });
    })();

    // Entrance animation
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var items = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
      if (reduce || !('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('is-in'); });
        return;
      }
      // hero reveals immediately on load
      requestAnimationFrame(function () {
        document.querySelectorAll('.hero .reveal').forEach(function (el) { el.classList.add('is-in'); });
      });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      items.forEach(function (el) {
        if (!el.closest('.hero')) io.observe(el);
      });
    })();

    // Ambient global scene: detection boxes, self-driving cars, robots,
    // trajectories and lidar sweeps drifting behind the whole page.
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canvas = document.getElementById('bg-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0, raf = null, agents = [], grid = [];
      var INK = '23,23,26';
      function R(a, b) { return a + Math.random() * (b - a); }

      function buildGrid() {
        grid = [];
        for (var y = 26; y < H; y += 50) for (var x = 26; x < W; x += 50) grid.push([x, y]);
      }
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildGrid();
      }
      function spawn(type) {
        var vx = R(-0.28, 0.28); if (Math.abs(vx) < 0.06) vx = 0.12;
        return { type: type, x: R(0, W || 1200), y: R(0, H || 800),
          vx: vx, vy: R(-0.16, 0.16), s: R(0, 200), conf: Math.floor(R(90, 99)) };
      }
      function build() {
        var plan = ['box', 'box', 'box', 'car', 'car', 'car', 'robot', 'robot', 'traj', 'traj', 'lidar'];
        agents = plan.map(spawn);
      }
      function stroke(a) { ctx.strokeStyle = 'rgba(' + INK + ',' + a + ')'; }
      function fill(a) { ctx.fillStyle = 'rgba(' + INK + ',' + a + ')'; }
      function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); }
      function corner(x, y, dx, dy, L) { ctx.beginPath(); ctx.moveTo(x + dx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * L); ctx.stroke(); }

      function drawBox(g) {
        var w = 64, h = 46; ctx.lineWidth = 1;
        stroke(0.10); ctx.setLineDash([3, 5]); ctx.strokeRect(g.x, g.y, w, h); ctx.setLineDash([]);
        stroke(0.32);
        corner(g.x, g.y, 1, 1, 9); corner(g.x + w, g.y, -1, 1, 9);
        corner(g.x, g.y + h, 1, -1, 9); corner(g.x + w, g.y + h, -1, -1, 9);
        fill(0.30); ctx.font = '9px ui-monospace, Menlo, monospace';
        ctx.fillText('0.' + g.conf, g.x + 1, g.y - 5);
      }
      function drawCar(g) {
        ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(Math.atan2(g.vy, g.vx));
        stroke(0.17); ctx.lineWidth = 1;
        rr(-11, -6, 22, 12, 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -6); ctx.lineTo(3, 6); ctx.moveTo(-3, -6); ctx.lineTo(-3, 6); ctx.stroke();
        ctx.restore();
        stroke(0.07); ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x - g.vx * 110, g.y - g.vy * 110); ctx.stroke(); ctx.setLineDash([]);
      }
      function drawRobot(g) {
        var bob = Math.sin(g.s * 0.03) * 2;
        ctx.save(); ctx.translate(g.x, g.y + bob); stroke(0.17); ctx.lineWidth = 1;
        rr(-5, -16, 10, 8, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, -20); ctx.stroke();
        fill(0.3); ctx.beginPath(); ctx.arc(0, -21, 1.3, 0, 6.3); ctx.fill();
        rr(-6, -7, 12, 13, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-10, 3); ctx.moveTo(6, -4); ctx.lineTo(10, 3);
        ctx.moveTo(-3, 6); ctx.lineTo(-3, 12); ctx.moveTo(3, 6); ctx.lineTo(3, 12); ctx.stroke();
        ctx.restore();
      }
      function drawTraj(g) {
        stroke(0.12); ctx.lineWidth = 1.2; ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(g.x, g.y);
        ctx.bezierCurveTo(g.x + 48, g.y - 42, g.x + 96, g.y + 30, g.x + 150, g.y - 12);
        ctx.stroke(); ctx.setLineDash([]);
        var t = (Math.sin(g.s * 0.025) + 1) / 2;
        fill(0.34); ctx.beginPath(); ctx.arc(g.x + 150 * t, g.y - 12 * t, 2, 0, 6.3); ctx.fill();
      }
      function drawLidar(g) {
        var pulse = (Math.sin(g.s * 0.035) + 1) / 2; stroke(0.11); ctx.lineWidth = 1;
        for (var i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(g.x, g.y, 9 + i * 9 + pulse * 6, -0.55, 0.55); ctx.stroke(); }
        fill(0.3); ctx.beginPath(); ctx.arc(g.x, g.y, 2, 0, 6.3); ctx.fill();
      }
      var drawers = { box: drawBox, car: drawCar, robot: drawRobot, traj: drawTraj, lidar: drawLidar };

      function frame() {
        ctx.clearRect(0, 0, W, H);
        fill(0.04);
        for (var i = 0; i < grid.length; i++) ctx.fillRect(grid[i][0] - 0.7, grid[i][1] - 0.7, 1.4, 1.4);
        for (var k = 0; k < agents.length; k++) {
          var g = agents[k];
          g.x += g.vx; g.y += g.vy; g.s += 0.5;
          if (g.x < -180) g.x = W + 140; else if (g.x > W + 180) g.x = -140;
          if (g.y < -180) g.y = H + 140; else if (g.y > H + 180) g.y = -140;
          drawers[g.type](g);
        }
        raf = requestAnimationFrame(frame);
      }

      resize(); build();
      window.addEventListener('resize', function () { resize(); }, { passive: true });
      if (reduce) { frame(); if (raf) { cancelAnimationFrame(raf); raf = null; } }
      else {
        frame();
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
          else if (!raf) { frame(); }
        });
      }
    })();

    // Interactive perception layer: cursor tracker + page "perception" locks
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var canvas = document.getElementById('fx-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0, INK = '23,23,26', raf = null, tick = 0, locks = [], bursts = [];

      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });
      // click → detection "lock" burst at the robot
      window.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch') return;
        bursts.push({ x: e.clientX, y: e.clientY, age: 0, max: 32 });
        if (!raf) frame();
      }, { passive: true });

      function stroke(a) { ctx.strokeStyle = 'rgba(' + INK + ',' + a + ')'; }
      function fill(a) { ctx.fillStyle = 'rgba(' + INK + ',' + a + ')'; }
      function dashed(x, y, w, h, a) { stroke(a); ctx.lineWidth = 1; ctx.setLineDash([3, 4]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]); }
      function corners(x, y, w, h, L, a) {
        stroke(a); ctx.lineWidth = 1.2;
        function c(px, py, dx, dy) { ctx.beginPath(); ctx.moveTo(px + dx * L, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * L); ctx.stroke(); }
        c(x, y, 1, 1); c(x + w, y, -1, 1); c(x, y + h, 1, -1); c(x + w, y + h, -1, -1);
      }
      function label(x, y, t, a) { fill(a); ctx.font = '10px ui-monospace, Menlo, monospace'; ctx.fillText(t, x, y); }

      function labelFor(el) {
        if (el.classList.contains('hero__name')) return 'person 0.99';
        if (el.classList.contains('eyebrow')) return (el.textContent.trim().split(/\s+/).pop() || 'section').toLowerCase();
        if (el.classList.contains('pub')) return 'paper 0.' + (90 + (tick % 9));
        if (el.classList.contains('callout')) return 'notice 0.96';
        return 'region';
      }
      function spawnLock() {
        var cand = [];
        document.querySelectorAll('.hero__name, .eyebrow, .pub, .callout').forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.width > 0 && r.bottom > 80 && r.top < H - 30) cand.push(el);
        });
        if (!cand.length) return;
        var el = cand[Math.floor(Math.random() * cand.length)];
        for (var i = 0; i < locks.length; i++) if (locks[i].el === el) return;
        locks.push({ el: el, label: labelFor(el), age: 0, ttl: 150 });
      }

      function frame() {
        tick++;
        ctx.clearRect(0, 0, W, H);
        if (tick % 135 === 0 && locks.length < 2) spawnLock();
        for (var i = locks.length - 1; i >= 0; i--) {
          var lk = locks[i]; lk.age++;
          if (lk.age > lk.ttl) { locks.splice(i, 1); continue; }
          var r = lk.el.getBoundingClientRect();
          if (r.bottom < 0 || r.top > H || r.width === 0) continue;
          var a = Math.max(0, Math.min(1, Math.min(lk.age / 12, 1) * Math.min((lk.ttl - lk.age) / 20, 1)));
          var p = 6, x = r.left - p, y = r.top - p, w = r.width + p * 2, h = r.height + p * 2;
          dashed(x, y, w, h, a * 0.16);
          corners(x, y, w, h, 11, a * 0.5);
          label(x + 2, y - 6, lk.label, a * 0.55);
        }
        // click bursts
        for (var bi = bursts.length - 1; bi >= 0; bi--) {
          var bs = bursts[bi]; bs.age++;
          if (bs.age > bs.max) { bursts.splice(bi, 1); continue; }
          var bp = bs.age / bs.max, be = 1 - Math.pow(1 - bp, 3), ba = 1 - bp;
          var sz = 12 + be * 46;
          corners(bs.x - sz / 2, bs.y - sz / 2, sz, sz, 7, ba * 0.6);
          stroke(ba * 0.30); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(bs.x, bs.y, sz * 0.6, 0, 6.3); ctx.stroke();
          fill(ba * 0.5);
          for (var pa = 0; pa < 4; pa++) {
            var ang = pa * 1.5708 + 0.7, rd = be * 28;
            ctx.fillRect(bs.x + Math.cos(ang) * rd - 1, bs.y + Math.sin(ang) * rd - 1, 2, 2);
          }
          if (bp < 0.65) label(bs.x + sz / 2 - 2, bs.y - sz / 2 - 4, 'locked', ba * 0.55);
        }
        raf = requestAnimationFrame(frame);
      }
      frame();
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
        else if (!raf) { frame(); }
      });
    })();

    // Hero name: decode/scramble-in
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var el = document.querySelector('.hero__name');
      if (!el || reduce) return;
      var text = el.textContent.trim();
      var glyphs = 'ABCDEFGHKMNPRSTVXZ#%$&/<>*0101';
      el.textContent = '';
      var chars = [];
      for (var i = 0; i < text.length; i++) {
        if (text[i] === ' ') { var sp = document.createElement('span'); sp.className = 'sp'; el.appendChild(sp); continue; }
        var s = document.createElement('span'); s.className = 'char is-scrambling'; s.textContent = text[i];
        el.appendChild(s); chars.push({ el: s, final: text[i], delay: i * 60, dur: 340 });
      }
      var start = null;
      function tick(ts) {
        if (start === null) start = ts;
        var t = ts - start, done = true;
        for (var i = 0; i < chars.length; i++) {
          var ch = chars[i];
          if (t >= ch.delay + ch.dur) { if (ch.el.textContent !== ch.final) { ch.el.textContent = ch.final; ch.el.classList.remove('is-scrambling'); } }
          else { ch.el.textContent = glyphs[(Math.floor(t / 38) + i * 3) % glyphs.length]; done = false; }
        }
        if (!done) requestAnimationFrame(tick);
      }
      requestAnimationFrame(function () { requestAnimationFrame(tick); });
    })();

    // Magnetic hover on hero social icons
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      document.querySelectorAll('.hero__social a').forEach(function (a) {
        a.addEventListener('pointermove', function (e) {
          var r = a.getBoundingClientRect();
          a.style.transform = 'translate(' + (e.clientX - r.left - r.width / 2) * 0.3 + 'px,' + (e.clientY - r.top - r.height / 2) * 0.3 + 'px)';
        });
        a.addEventListener('pointerleave', function () { a.style.transform = ''; });
      });
    })();

    // Google Scholar citation counts (vanilla; replaces jQuery version)
    (function () {
      var base = {% if site.google_scholar_stats_use_cdn %}'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'{% else %}'https://raw.githubusercontent.com/{{ site.repository }}/'{% endif %};
      fetch(base + 'google-scholar-stats/gs_data.json')
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var total = document.getElementById('total_cit');
          if (total && data.citedby != null) total.textContent = data.citedby;
          document.querySelectorAll('.show_paper_citations').forEach(function (el) {
            var id = el.getAttribute('data');
            var pub = data.publications && data.publications[id];
            if (pub && pub.num_citations != null) el.textContent = 'Citations: ' + pub.num_citations;
          });
        })
        .catch(function () {});
    })();
  </script>

</body>
</html>
